/*
  Argus - EventService 事件上报契约
  - AIEvent 字段编号 1-18 与设计文档一致，新增字段从 19 开始加。
  - 事件上报：Gateway 客户端流式批量推 → Controller 收完整批后 ACK。
  - 至少一次投递（at-least-once）：Controller 必须按 event_id 去重。
*/
syntax = "proto3";

package argus.event.v1alpha1;

option go_package = "github.com/ctkqiang/argus/pkg/pb/argus/event/v1alpha1;event";

import "argus/detection.proto";

// EventService Gateway → Controller 的事件上报。
// 客户端半关闭流之后，Controller 处理整批并返回一次 ReportAck。
service EventService {
  rpc ReportEvents(stream AIEvent) returns (ReportAck);
}

// FinalAction 网关最后的放行/阻断决策。枚举比字符串稳，别乱拼大小写。
enum FinalAction {
  FINAL_ACTION_UNSPECIFIED = 0;
  FINAL_ACTION_ALLOW = 1;
  FINAL_ACTION_BLOCK = 2;
  FINAL_ACTION_DEGRADED_ALLOW = 3;
  FINAL_ACTION_DEGRADED_BLOCK = 4;
}

// Severity 事件整体严重度，和 policy.thresholds 对齐。
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

// AIEvent 一条 LLM 出站请求对应的审计事件。
// 1-18 编号锁定，以后要加新字段一律从 19 往后追加，不许插队。
message AIEvent {
  // 1 事件全局唯一 ID。推荐 uuid v4。
  string event_id = 1;

  // 2 事件发生时间。epoch 毫秒。
  int64 timestamp = 2;

  // 3 集群 ID。部署时通过 env/CRD 显式注入；MVP 别自己算 CA 哈希，算不准。
  string cluster_id = 3;

  // 4 源 Pod 命名空间。
  string namespace = 4;

  // 5 源 Pod 名。
  string pod_name = 5;

  // 6 源 Pod 对应的上层工作负载（Deployment/StatefulSet/DaemonSet...）名。
  string workload = 6;

  // 7 源容器名。MVP 没有就空串（粒度到 pod）。
  string container = 7;

  // 8 五元组源 IP。一般是 PodIP；hostNetwork 就是节点 IP。
  string source_ip = 8;

  // 9 请求目标。优先 SNI / Host，拿不到就 IP:port。
  string destination = 9;

  // 10 匹配到的 LLMProvider 资源名（metadata.name）。
  string provider = 10;

  // 11 模型 ID，比如 gpt-4o。解析不到空串。
  string model = 11;

  // 12 会话 ID。网关按 (namespace, pod, provider, model, 时间窗口) 聚出来的串 ID。
  string session_id = 12;

  // 13 请求 ID。优先复用上游 X-Request-Id；没有网关自己生成 uuid。
  string request_id = 13;

  // 14 请求体截断 + 脱敏后的原文。默认 4KiB 上限。
  string request_payload = 14;

  // 15 响应体截断 + 脱敏后的原文。默认 4KiB 上限。
  string response_payload = 15;

  // 16 本事件的严重度分级，对齐 policy.thresholds。
  Severity severity = 16;

  // 17 request_payload 里的 prompt 文本（非 tools/system）做的稳定哈希，
  // 用来做重复攻击聚类。推荐 sha256（hex），没算就空串。
  string prompt_hash = 17;

  // 18 如果本事件走了降级/失败，这里写原因码：detector_timeout /
  // policy_unavailable / tls_inspect_failed / provider_unknown。
  // 没有任何失败就空串。
  string failure_reason = 18;

  // 19 所有检测器结果。按 pipeline 顺序追加（rules/heuristic/encoding/semantic）。
  repeated argus.detection.v1alpha1.DetectionResult detection_results = 19;

  // 20 风险引擎最终打分，范围 [0.0, 1.0]。
  double risk_score = 20;

  // 21 网关最后决策。
  FinalAction final_action = 21;
}

// ReportAck 控制器对一整批事件流的确认。
message ReportAck {
  // 1 本流实际收到的事件条数。
  int64 received_events = 1;

  // 2 成功写到持久化介质（本地 PV / 对象存储）的条数。
  int64 persisted_events = 2;

  // 3 本轮失败的 event_id 列表。网关在下一条流里原样重试这些事件。
  repeated string failed_event_ids = 3;

  // 4 本流最后一条成功持久化的 event_id。网关用来推进游标。
  string last_event_id = 4;

  // 5 Controller 建议网关的重试间隔，毫秒。默认 0 = 网关自己决定退避。
  int64 retry_delay_ms = 5;

  // 6 本批的处理窗口开始时间（controller 侧），epoch 毫秒。0 代表没提供。
  int64 window_start_ms = 6;

  // 7 本批的处理窗口结束时间（controller 侧），epoch 毫秒。0 代表没提供。
  int64 window_end_ms = 7;
}
