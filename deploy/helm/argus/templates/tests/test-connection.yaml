apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "argus.fullname" . }}-test-connection"
  labels: {{ include "argus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://{{ include "argus.fullname" . }}-gateway.{{ .Release.Namespace }}.svc:9090/healthz"]
  restartPolicy: Never
