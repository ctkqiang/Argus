<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fafafa" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1f1f">Kubernetes 部署拓扑</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#8c8c8c">argus 命名空间组件 · 与业务命名空间隔离 · 零入侵</text>

  <!-- Cluster 边界 -->
  <rect x="20" y="70" width="700" height="450" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="92" font-size="12" font-weight="700" fill="#595959">K8s Cluster</text>

  <!-- argus 命名空间 -->
  <rect x="40" y="105" width="660" height="280" rx="8" fill="#fff7e6" stroke="#ffd591" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="56" y="125" font-size="12" font-weight="700" fill="#d46b08">namespace: argus</text>

  <!-- 业务命名空间示例 -->
  <rect x="40" y="400" width="660" height="100" rx="8" fill="#e6f4ff" stroke="#91caff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="56" y="420" font-size="12" font-weight="700" fill="#0958d9">namespace: default / business-*（业务命名空间）</text>

  <!-- gateway Deployment + HPA + Service -->
  <g transform="translate(60, 145)">
    <rect width="180" height="220" rx="8" fill="#fff" stroke="#fa8c16" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#fa8c16"/>
    <rect y="20" width="180" height="8" fill="#fa8c16"/>
    <text x="90" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">argus-gateway</text>

    <text x="14" y="48" font-size="10" font-weight="700" fill="#1f1f1f">Deployment</text>
    <text x="14" y="62" font-size="10" fill="#595959">replicas: 2 (HPA)</text>
    <text x="14" y="76" font-size="10" fill="#595959">min=2 / max=10</text>
    <text x="14" y="90" font-size="10" fill="#595959">CPU target 70%</text>

    <line x1="14" y1="100" x2="166" y2="100" stroke="#ffd591" stroke-width="1"/>

    <text x="14" y="118" font-size="10" font-weight="700" fill="#1f1f1f">Service</text>
    <text x="14" y="132" font-size="10" fill="#595959">ClusterIP :8443</text>
    <text x="14" y="146" font-size="10" fill="#595959">TLS 终止</text>

    <line x1="14" y1="158" x2="166" y2="158" stroke="#ffd591" stroke-width="1"/>

    <text x="14" y="176" font-size="10" font-weight="700" fill="#1f1f1f">资源</text>
    <text x="14" y="190" font-size="10" fill="#595959">500m/512Mi</text>
    <text x="14" y="204" font-size="10" fill="#595959">2x/2Gi limit</text>
  </g>

  <!-- controller Deployment -->
  <g transform="translate(260, 145)">
    <rect width="180" height="220" rx="8" fill="#fff" stroke="#fa541c" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#fa541c"/>
    <rect y="20" width="180" height="8" fill="#fa541c"/>
    <text x="90" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">argus-controller</text>

    <text x="14" y="48" font-size="10" font-weight="700" fill="#1f1f1f">Deployment</text>
    <text x="14" y="62" font-size="10" fill="#595959">replicas: 1</text>
    <text x="14" y="76" font-size="10" fill="#595959">Leader Election</text>

    <line x1="14" y1="100" x2="166" y2="100" stroke="#ffccc7" stroke-width="1"/>

    <text x="14" y="118" font-size="10" font-weight="700" fill="#1f1f1f">Service</text>
    <text x="14" y="132" font-size="10" fill="#595959">ClusterIP :8444</text>
    <text x="14" y="146" font-size="10" fill="#595959">gRPC server</text>

    <line x1="14" y1="158" x2="166" y2="158" stroke="#ffccc7" stroke-width="1"/>

    <text x="14" y="176" font-size="10" font-weight="700" fill="#1f1f1f">RBAC</text>
    <text x="14" y="190" font-size="10" fill="#595959">pods/list/watch</text>
    <text x="14" y="204" font-size="10" fill="#595959">CRD ASP/LLMProvider</text>
  </g>

  <!-- 引流层 DaemonSet -->
  <g transform="translate(460, 145)">
    <rect width="180" height="220" rx="8" fill="#fff" stroke="#52c41a" stroke-width="2"/>
    <rect width="180" height="28" rx="8" fill="#52c41a"/>
    <rect y="20" width="180" height="8" fill="#52c41a"/>
    <text x="90" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ds-node-tproxy</text>

    <text x="14" y="48" font-size="10" font-weight="700" fill="#1f1f1f">DaemonSet</text>
    <text x="14" y="62" font-size="10" fill="#595959">每节点 1 副本</text>
    <text x="14" y="76" font-size="10" fill="#595959">hostNetwork: true</text>
    <text x="14" y="90" font-size="10" fill="#595959">cap: NET_ADMIN</text>

    <line x1="14" y1="100" x2="166" y2="100" stroke="#b7eb8f" stroke-width="1"/>

    <text x="14" y="118" font-size="10" font-weight="700" fill="#1f1f1f">iptables 规则</text>
    <text x="14" y="132" font-size="10" fill="#595959">mangle PREROUTING</text>
    <text x="14" y="146" font-size="10" fill="#595959">mangle OUTPUT</text>

    <line x1="14" y1="158" x2="166" y2="158" stroke="#b7eb8f" stroke-width="1"/>

    <text x="14" y="176" font-size="10" font-weight="700" fill="#1f1f1f">故障降级</text>
    <text x="14" y="190" font-size="10" fill="#595959">preStop 清链</text>
    <text x="14" y="204" font-size="10" fill="#595959">不静默丢包</text>
  </g>

  <!-- CA Secret -->
  <g transform="translate(60, 380)">
    <rect width="180" height="30" rx="4" fill="#fffbe6" stroke="#ffe58f" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#d48806">Secret: argus-ca-tls</text>
  </g>
  <g transform="translate(260, 380)">
    <rect width="180" height="30" rx="4" fill="#f9f0ff" stroke="#d3adf7" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#531dab">MutatingWebhook</text>
  </g>
  <g transform="translate(460, 380)">
    <rect width="180" height="30" rx="4" fill="#e6fffb" stroke="#87e8de" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#08979c">PV: events (jsonl)</text>
  </g>

  <!-- 业务 Pod -->
  <g transform="translate(60, 440)">
    <rect width="180" height="50" rx="6" fill="#fff" stroke="#1677ff" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#1f1f1f">业务 Pod</text>
    <text x="90" y="36" text-anchor="middle" font-size="9" fill="#595959">无 sidecar · 零改造</text>
  </g>

  <g transform="translate(260, 440)">
    <rect width="180" height="50" rx="6" fill="#fff" stroke="#1677ff" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#1f1f1f">业务 Pod</text>
    <text x="90" y="36" text-anchor="middle" font-size="9" fill="#595959">trust store 含 argus CA</text>
  </g>

  <!-- 外部 LLM -->
  <g transform="translate(740, 150)">
    <rect width="140" height="100" rx="6" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#531dab">LLM Provider</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#595959">api.openai.com</text>
    <text x="70" y="58" text-anchor="middle" font-size="10" fill="#595959">外部 DNS 解析</text>
    <text x="70" y="78" text-anchor="middle" font-size="10" fill="#595959">SSE / HTTP2</text>
    <text x="70" y="92" text-anchor="middle" font-size="10" fill="#8c8c8c">原样反压</text>
  </g>

  <!-- 流量箭头 -->
  <line x1="240" y1="255" x2="260" y2="255" stroke="#1677ff" stroke-width="2" marker-end="url(#arr1)"/>
  <text x="250" y="248" text-anchor="middle" font-size="9" fill="#1677ff">gRPC</text>

  <line x1="440" y1="255" x2="460" y2="255" stroke="#1677ff" stroke-width="2" marker-end="url(#arr1)"/>

  <line x1="640" y1="200" x2="740" y2="200" stroke="#52c41a" stroke-width="2" marker-end="url(#arr1)"/>
  <text x="690" y="192" text-anchor="middle" font-size="9" fill="#52c41a">放行出站</text>

  <line x1="150" y1="440" x2="150" y2="365" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr2)"/>
  <text x="180" y="408" font-size="9" fill="#8c8c8c">CA 注入</text>

  <!-- Legend -->
  <g transform="translate(740, 270)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1f1f1f">Legend</text>
    <rect x="0" y="10" width="14" height="14" fill="#fa8c16" rx="2"/>
    <text x="20" y="22" font-size="10" fill="#595959">网关层</text>
    <rect x="0" y="32" width="14" height="14" fill="#fa541c" rx="2"/>
    <text x="20" y="44" font-size="10" fill="#595959">控制面</text>
    <rect x="0" y="54" width="14" height="14" fill="#52c41a" rx="2"/>
    <text x="20" y="66" font-size="10" fill="#595959">引流层</text>
    <rect x="0" y="76" width="14" height="14" fill="#722ed1" rx="2"/>
    <text x="20" y="88" font-size="10" fill="#595959">外部 LLM</text>
    <rect x="0" y="98" width="14" height="14" fill="#1677ff" rx="2"/>
    <text x="20" y="110" font-size="10" fill="#595959">业务 Pod</text>
  </g>
</svg>
