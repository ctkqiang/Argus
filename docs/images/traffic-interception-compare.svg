<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="460" fill="#fafafa" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1f1f">出口引流四方案对比（MVP 首选 / 兜底 / 排除）</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#8c8c8c">工作层 · 业务影响 · 硬限制</text>

  <!-- 4 个方案列 -->
  <!-- A. Cilium eBPF -->
  <g transform="translate(30, 75)">
    <rect width="200" height="360" rx="8" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
    <rect width="200" height="40" rx="8" fill="#52c41a"/>
    <rect y="32" width="200" height="8" fill="#52c41a"/>
    <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A. Cilium eBPF</text>
    <text x="100" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#389e0d">MVP 首选 ★</text>

    <text x="14" y="84" font-size="11" font-weight="700" fill="#1f1f1f">工作层</text>
    <text x="14" y="100" font-size="10" fill="#595959">L3/L4 eBPF hook</text>
    <text x="14" y="114" font-size="10" fill="#595959">节点出口</text>

    <text x="14" y="138" font-size="11" font-weight="700" fill="#1f1f1f">业务影响</text>
    <text x="14" y="154" font-size="10" fill="#52c41a" font-weight="600">0（无 sidecar）</text>

    <text x="14" y="178" font-size="11" font-weight="700" fill="#1f1f1f">优势</text>
    <text x="14" y="194" font-size="10" fill="#595959">• 不碰业务 netns</text>
    <text x="14" y="208" font-size="10" fill="#595959">• Pod 粒度策略</text>
    <text x="14" y="222" font-size="10" fill="#595959">• 跟 ASP.scope 对齐</text>

    <text x="14" y="246" font-size="11" font-weight="700" fill="#cf1322">硬限制</text>
    <text x="14" y="262" font-size="10" fill="#595959">• Cilium ≥ 1.14</text>
    <text x="14" y="276" font-size="10" fill="#595959">  开 egressGateway</text>
    <text x="14" y="290" font-size="10" fill="#595959">• GKE Autopilot 等</text>
    <text x="14" y="304" font-size="10" fill="#595959">  托管 K8s 不适用</text>

    <rect x="14" y="320" width="172" height="26" rx="4" fill="#d9f7be"/>
    <text x="100" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#389e0d">✓ MVP 默认</text>
  </g>

  <!-- B. Istio -->
  <g transform="translate(245, 75)">
    <rect width="200" height="360" rx="8" fill="#fff1f0" stroke="#ff4d4f" stroke-width="2"/>
    <rect width="200" height="40" rx="8" fill="#ff4d4f"/>
    <rect y="32" width="200" height="8" fill="#ff4d4f"/>
    <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">B. Istio Egress</text>
    <text x="100" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#cf1322">MVP 排除 ✗</text>

    <text x="14" y="84" font-size="11" font-weight="700" fill="#1f1f1f">工作层</text>
    <text x="14" y="100" font-size="10" fill="#595959">L7 sidecar 网格</text>

    <text x="14" y="124" font-size="11" font-weight="700" fill="#1f1f1f">业务影响</text>
    <text x="14" y="140" font-size="10" fill="#cf1322" font-weight="600">❌ 强制 sidecar</text>
    <text x="14" y="154" font-size="10" fill="#cf1322">违反 checklist C2</text>

    <text x="14" y="178" font-size="11" font-weight="700" fill="#1f1f1f">优势</text>
    <text x="14" y="194" font-size="10" fill="#595959">• 协议识别细</text>
    <text x="14" y="208" font-size="10" fill="#595959">• 遥测全</text>

    <text x="14" y="232" font-size="11" font-weight="700" fill="#cf1322">硬限制</text>
    <text x="14" y="248" font-size="10" fill="#cf1322" font-weight="600">业务 Pod 必须挂</text>
    <text x="14" y="262" font-size="10" fill="#cf1322" font-weight="600">sidecar → C2 红线</text>

    <rect x="14" y="320" width="172" height="26" rx="4" fill="#ffccc7"/>
    <text x="100" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#cf1322">✗ 不采用</text>
  </g>

  <!-- C. iptables TPROXY -->
  <g transform="translate(460, 75)">
    <rect width="200" height="360" rx="8" fill="#fff7e6" stroke="#fa8c16" stroke-width="2"/>
    <rect width="200" height="40" rx="8" fill="#fa8c16"/>
    <rect y="32" width="200" height="8" fill="#fa8c16"/>
    <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C. iptables TPROXY</text>
    <text x="100" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#d46b08">MVP 兜底 ⚠</text>

    <text x="14" y="84" font-size="11" font-weight="700" fill="#1f1f1f">工作层</text>
    <text x="14" y="100" font-size="10" fill="#595959">netfilter mangle</text>
    <text x="14" y="114" font-size="10" fill="#595959">PREROUTING/OUTPUT</text>

    <text x="14" y="138" font-size="11" font-weight="700" fill="#1f1f1f">业务影响</text>
    <text x="14" y="154" font-size="10" fill="#52c41a" font-weight="600">很小（无 sidecar）</text>

    <text x="14" y="178" font-size="11" font-weight="700" fill="#1f1f1f">优势</text>
    <text x="14" y="194" font-size="10" fill="#595959">• 任何 vanilla K8s</text>
    <text x="14" y="208" font-size="10" fill="#595959">• 不挑 CNI</text>
    <text x="14" y="222" font-size="10" fill="#595959">• Cilium 互斥兜底</text>

    <text x="14" y="246" font-size="11" font-weight="700" fill="#cf1322">硬限制</text>
    <text x="14" y="262" font-size="10" fill="#595959">• 仅 TCP（UDP 不行）</text>
    <text x="14" y="276" font-size="10" fill="#595959">• 不能与别家 tproxy 共存</text>
    <text x="14" y="290" font-size="10" fill="#595959">• DaemonSet 需 NET_ADMIN</text>
    <text x="14" y="304" font-size="10" fill="#595959">• hostNetwork 走 OUTPUT</text>

    <rect x="14" y="320" width="172" height="26" rx="4" fill="#ffe7ba"/>
    <text x="100" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#d46b08">⚠ 兜底方案</text>
  </g>

  <!-- D. VPC 路由 -->
  <g transform="translate(675, 75)">
    <rect width="200" height="360" rx="8" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
    <rect width="200" height="40" rx="8" fill="#722ed1"/>
    <rect y="32" width="200" height="8" fill="#722ed1"/>
    <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">D. VPC 路由表</text>
    <text x="100" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#531dab">特例 ◆</text>

    <text x="14" y="84" font-size="11" font-weight="700" fill="#1f1f1f">工作层</text>
    <text x="14" y="100" font-size="10" fill="#595959">VPC 路由</text>
    <text x="14" y="114" font-size="10" fill="#595959">下一跳 NLB → GW</text>

    <text x="14" y="138" font-size="11" font-weight="700" fill="#1f1f1f">业务影响</text>
    <text x="14" y="154" font-size="10" fill="#52c41a" font-weight="600">0</text>

    <text x="14" y="178" font-size="11" font-weight="700" fill="#1f1f1f">优势</text>
    <text x="14" y="194" font-size="10" fill="#595959">• 不依赖 CNI</text>
    <text x="14" y="208" font-size="10" fill="#595959">• 统一云上出口</text>

    <text x="14" y="232" font-size="11" font-weight="700" fill="#cf1322">硬限制</text>
    <text x="14" y="248" font-size="10" fill="#595959">• 自管 K8s + 同 VPC</text>
    <text x="14" y="262" font-size="10" fill="#595959">• 托管 K8s 不让改</text>
    <text x="14" y="276" font-size="10" fill="#595959">  路由表下一跳</text>
    <text x="14" y="290" font-size="10" fill="#595959">• SNAT 场景源 IP 不可信</text>

    <rect x="14" y="320" width="172" height="26" rx="4" fill="#efdbff"/>
    <text x="100" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#531dab">◆ 特例</text>
  </g>
</svg>
