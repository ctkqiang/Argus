<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fa8c16"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722ed1"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#fafafa" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f1f1f">Pod 身份溯源链路</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#8c8c8c">gateway 零 RBAC · controller 是唯一真源 · 不推测只查询</text>

  <!-- Gateway -->
  <g transform="translate(30, 100)">
    <rect width="220" height="180" rx="8" fill="#fff" stroke="#fa8c16" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#fa8c16"/>
    <rect y="24" width="220" height="8" fill="#fa8c16"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">argus-gateway</text>
    <text x="110" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#cf1322">零 RBAC · 无 k8s 权限</text>
    <text x="14" y="78" font-size="10" fill="#595959">看不到业务 Pod 的：</text>
    <text x="20" y="92" font-size="10" fill="#8c8c8c">• netns / 进程 / k8s 资源</text>
    <text x="14" y="112" font-size="10" fill="#595959">绝不推测身份：</text>
    <text x="20" y="126" font-size="10" fill="#8c8c8c">• 5 元组原样写 AIEvent</text>
    <text x="20" y="140" font-size="10" fill="#8c8c8c">• confidence 不擅自补</text>
    <text x="14" y="160" font-size="10" font-weight="700" fill="#0958d9">查询输入：</text>
    <text x="20" y="174" font-size="10" fill="#595959">src_ip · src_port · time_ms</text>
  </g>

  <!-- 中间箭头：查询 + 返回 -->
  <line x1="250" y1="170" x2="350" y2="170" stroke="#1677ff" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="300" y="160" text-anchor="middle" font-size="10" fill="#1677ff" font-weight="600">PodIdentityService.Lookup</text>
  <text x="300" y="186" text-anchor="middle" font-size="9" fill="#595959">(src_ip, src_port, time_epoch_ms, dst_ip, dst_port)</text>

  <line x1="350" y1="210" x2="250" y2="210" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="300" y="225" text-anchor="middle" font-size="10" fill="#fa8c16" font-weight="600">返回 8 字段 + confidence</text>

  <!-- Controller -->
  <g transform="translate(350, 100)">
    <rect width="220" height="180" rx="8" fill="#fff" stroke="#fa541c" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#fa541c"/>
    <rect y="24" width="220" height="8" fill="#fa541c"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">argus-controller</text>
    <text x="110" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#389e0d">有 pods/list/watch 权限</text>
    <text x="14" y="78" font-size="10" font-weight="700" fill="#1f1f1f">溯源算法（5 步）：</text>
    <text x="20" y="92" font-size="9" fill="#595959">1. informer cache 查 IP→Pod</text>
    <text x="20" y="105" font-size="9" fill="#595959">2. at_time_ms 时间窗口校验</text>
    <text x="20" y="118" font-size="9" fill="#595959">3. hostNet 冲突 → confidence=0.6</text>
    <text x="20" y="131" font-size="9" fill="#595959">4. 已退出 Pod → ring buffer</text>
    <text x="20" y="144" font-size="9" fill="#595959">5. SNAT → confidence=0.2</text>
    <text x="14" y="164" font-size="10" font-weight="700" fill="#1f1f1f">输出字段：</text>
    <text x="20" y="178" font-size="9" fill="#595959">pod_id · ns · workload · SA · node · confidence</text>
  </g>

  <!-- 最终箭头：写事件 -->
  <line x1="570" y1="190" x2="680" y2="190" stroke="#722ed1" stroke-width="2" marker-end="url(#arrPurple)"/>
  <text x="625" y="180" text-anchor="middle" font-size="10" fill="#722ed1" font-weight="600">写入</text>
  <text x="625" y="208" text-anchor="middle" font-size="10" fill="#722ed1" font-weight="600">AIEvent.pod_identity</text>

  <!-- AIEvent 落盘 -->
  <g transform="translate(680, 100)">
    <rect width="190" height="180" rx="8" fill="#fff" stroke="#722ed1" stroke-width="2"/>
    <rect width="190" height="32" rx="8" fill="#722ed1"/>
    <rect y="24" width="190" height="8" fill="#722ed1"/>
    <text x="95" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">AIEvent 落盘 / 上报</text>
    <text x="14" y="56" font-size="10" font-weight="700" fill="#1f1f1f">5 元组（原始）：</text>
    <text x="20" y="70" font-size="9" fill="#595959">src_ip · src_port</text>
    <text x="20" y="83" font-size="9" fill="#595959">dst_ip · dst_port</text>
    <text x="20" y="96" font-size="9" fill="#595959">at_time_ms</text>
    <text x="14" y="116" font-size="10" font-weight="700" fill="#1f1f1f">8 字段（溯源）：</text>
    <text x="20" y="130" font-size="9" fill="#595959">pod_id · pod_name · ns</text>
    <text x="20" y="143" font-size="9" fill="#595959">owner · workload_uid</text>
    <text x="20" y="156" font-size="9" fill="#595959">SA · node · labels</text>
    <text x="20" y="170" font-size="9" font-weight="700" fill="#722ed1">confidence ∈ [0,1]</text>
  </g>

  <!-- 准确性矩阵预览 -->
  <text x="30" y="320" font-size="13" font-weight="700" fill="#1f1f1f">准确性矩阵（5 场景 × confidence）</text>
  <g transform="translate(30, 332)">
    <!-- 表头 -->
    <rect width="840" height="28" fill="#fafafa" stroke="#e4e7eb"/>
    <text x="14" y="18" font-size="11" font-weight="700" fill="#1f1f1f">场景</text>
    <text x="350" y="18" font-size="11" font-weight="700" fill="#1f1f1f">confidence</text>
    <text x="450" y="18" font-size="11" font-weight="700" fill="#1f1f1f">failure_reason</text>
    <text x="720" y="18" font-size="11" font-weight="700" fill="#1f1f1f">命中级别</text>

    <!-- 行 -->
    <rect y="28" width="840" height="22" fill="#f6ffed" stroke="#e4e7eb"/>
    <text x="14" y="44" font-size="10" fill="#1f1f1f">1. 普通 Pod</text>
    <text x="350" y="44" font-size="10" font-weight="700" fill="#389e0d">1.0</text>
    <text x="450" y="44" font-size="10" fill="#8c8c8c">—</text>
    <text x="720" y="44" font-size="10" font-weight="700" fill="#389e0d">✓ 全命中</text>

    <rect y="50" width="840" height="22" fill="#fff7e6" stroke="#e4e7eb"/>
    <text x="14" y="66" font-size="10" fill="#1f1f1f">2. hostNetwork=true</text>
    <text x="350" y="66" font-size="10" font-weight="700" fill="#d48806">0.6 / 1.0</text>
    <text x="450" y="66" font-size="10" fill="#8c8c8c">host_network_src_collision</text>
    <text x="720" y="66" font-size="10" font-weight="700" fill="#d48806">⚠ 可能冲突</text>

    <rect y="72" width="840" height="22" fill="#f6ffed" stroke="#e4e7eb"/>
    <text x="14" y="88" font-size="10" fill="#1f1f1f">3. Pod 已退出（≤24h）</text>
    <text x="350" y="88" font-size="10" font-weight="700" fill="#389e0d">0.9</text>
    <text x="450" y="88" font-size="10" fill="#8c8c8c">pod_gc_already（未命中）</text>
    <text x="720" y="88" font-size="10" font-weight="700" fill="#389e0d">✓ ring buffer</text>

    <rect y="94" width="840" height="22" fill="#fafafa" stroke="#e4e7eb"/>
    <text x="14" y="110" font-size="10" fill="#1f1f1f">4. Pod 内多容器</text>
    <text x="350" y="110" font-size="10" font-weight="700" fill="#389e0d">0.95</text>
    <text x="450" y="110" font-size="10" fill="#8c8c8c">multi_container_unresolved</text>
    <text x="720" y="110" font-size="10" font-weight="700" fill="#389e0d">✓ 到 Pod 级</text>

    <rect y="116" width="840" height="22" fill="#fff1f0" stroke="#e4e7eb"/>
    <text x="14" y="132" font-size="10" fill="#1f1f1f">5. SNAT 场景</text>
    <text x="350" y="132" font-size="10" font-weight="700" fill="#cf1322">0.2</text>
    <text x="450" y="132" font-size="10" fill="#8c8c8c">egress_snat_lost_identity</text>
    <text x="720" y="132" font-size="10" font-weight="700" fill="#cf1322">✗ 仅节点级</text>
  </g>
</svg>
